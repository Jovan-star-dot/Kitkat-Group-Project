name: Install Lab 4 Specialist for Team Synthesis

on:
  push:
    branches:
      - raphael-synthesize-agent
    paths:
      - ".github/workflows/install-lab4-specialist.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lab 4 specialist files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lab4.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/lab4.b64 > /tmp/lab4.tar.gz
          tar -xzf /tmp/lab4.tar.gz -C .
          rm -f .github/workflows/install-lab4-specialist.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Lab 4 Promethean specialist for synthesis"
          git push origin HEAD:raphael-synthesize-agent
